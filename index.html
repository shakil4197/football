<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        var isExt = function (val) {
          return typeof val === 'string' && (val.indexOf('chrome-extension://') !== -1 || val.indexOf('moz-extension://') !== -1);
        };
        window.addEventListener(
          'error',
          function (e) {
            if (isExt(e.filename) || (e.error && isExt(e.error.stack))) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          },
          true
        );
      })();
    </script>
    <title>Floodlight Cup — Automated Football Tournament Simulator</title>
    <meta
      name="description"
      content="Automated 2D football tournament simulator with editable squads, automatic group and knockout brackets, 65-minute live matches, commentary, and player statistics."
    />
    <meta property="og:title" content="Floodlight Cup — Automated Football Tournament Simulator" />
    <meta
      property="og:description"
      content="Select 8 to 16 clubs, customize squads, and watch automated 65-minute floodlit matches progress from Group Stage to the Final."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Oswald:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#0B111A] text-[#F8FAFC] antialiased selection:bg-emerald-500/30 selection:text-emerald-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
